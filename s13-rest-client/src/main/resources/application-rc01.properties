# Profil lekcji Rc01RestClient.
# Adres bazowy API dostawcy. W prawdziwym życiu byłby to adres cudzej firmy, np. https://api.dostawca.example.
# Tu udawany dostawca (FakeSupplierController) działa w TEJ SAMEJ aplikacji, więc adres wskazuje na nią samą:
# ${server.port:8080} = port z ustawienia server.port, a gdy go nie ma — 8080.
rc01.supplier.base-url=http://localhost:${server.port:8080}
# Identyfikator naszego sklepu u dostawcy (nagłówek X-Shop-Id w każdym zapytaniu). Wartość przykładowa.
rc01.supplier.shop-id=sklep-01
