# Profil lekcji Rc02ErrorsAndTimeouts.
# Adres udawanego dostawcy — ta sama aplikacja (FakeSupplierController), port z server.port, domyślnie 8080.
rc02.supplier.base-url=http://localhost:${server.port:8080}

# Limity czasu dla WSZYSTKICH klientów HTTP budowanych z RestClient.Builder od Boota (Boot 4: spring.http.clients.*).
# connect-timeout = ile czekać na nawiązanie połączenia; read-timeout = ile czekać na odpowiedź.
# Bez tych ustawień Boot zostawia wartości domyślne biblioteki — dla klienta z JDK to brak limitu odczytu.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s
