# Profil lekcji Rc03HttpInterfaces.
# Ustawienia GRUPY klientów HTTP „dostawca” (nazwa z @ImportHttpServices(group = "dostawca")) — Boot 4:
# spring.http.serviceclient.<grupa>.*  Każda grupa ma własny RestClient z własnym adresem, nagłówkami i limitami.
#
# Adres udawanego dostawcy — ta sama aplikacja (FakeSupplierController), port z server.port, domyślnie 8080.
spring.http.serviceclient.dostawca.base-url=http://localhost:${server.port:8080}
# Nagłówek dokładany do KAŻDEGO zapytania tej grupy (dostawca bez niego odpowiada 400). Wartość przykładowa.
spring.http.serviceclient.dostawca.default-header.X-Shop-Id=sklep-01
# Limity czasu tylko dla tej grupy (nadpisują wspólne spring.http.clients.*).
spring.http.serviceclient.dostawca.connect-timeout=2s
spring.http.serviceclient.dostawca.read-timeout=3s
