# Profil lekcji Rc04Resilience.
# Adres udawanego dostawcy — ta sama aplikacja (FlakySupplierController), port z server.port, domyślnie 8080.
rc04.supplier.base-url=http://localhost:${server.port:8080}

# Ponawianie (@Retryable w SupplierClient czyta te wartości przez ${...}):
# najwyżej 3 ponowienia (razem 4 próby), pierwsze opóźnienie 200 ms, potem x2, ale nie więcej niż 2 s.
# Testy nadpisują rc04.retry.delay=0ms — nie czekają i nie zależą od zegara.
rc04.retry.max-retries=3
rc04.retry.delay=200ms
rc04.retry.max-delay=2s
