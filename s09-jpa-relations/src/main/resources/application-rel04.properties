# Profil lekcji Rel04LazyLoading (wlaczany w Rel04Application i w testach przez @ActiveProfiles("rel04")).
# Lekcja jest aplikacja WEBOWA (kontroler OrderController pokazuje open-in-view), wiec serwer WWW zostaje wlaczony.
# spring.jpa.open-in-view celowo NIE jest ustawione - lekcja pokazuje zachowanie DOMYSLNE (wlaczone + ostrzezenie).
# Wlasna baza H2 w pamieci - lekcje nie dziela danych.
spring.datasource.url=jdbc:h2:mem:rel04
# Schemat i dane startowe tworzy WYLACZNIE Flyway (migracje lekcji), a Hibernate tylko SPRAWDZA, czy encje pasuja do tabel.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/rel04
spring.jpa.hibernate.ddl-auto=validate
# Wypisywanie SQL (tylko do nauki).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Statystyki Hibernate (liczniki zapytan) - testy licza, ile SELECT-ow wysyla leniwe ladowanie.
spring.jpa.properties.hibernate.generate_statistics=true
