# Wspolne ustawienia modulu s09-jpa-relations — celowo MINIMALNE i BEZPIECZNE.
# Kazda lekcja ma wlasny plik application-<lekcja>.properties (profil), np. application-rel01.properties:
# wlasna baza H2 (jdbc:h2:mem:rel01), wlasne migracje Flyway (classpath:db/migration/rel01) i ddl-auto=validate.
# Profil wlacza klasa startowa lekcji (setAdditionalProfiles), a w testach adnotacja @ActiveProfiles.
#
# Flyway domyslnie WYLACZONY: bez profilu lekcji nie wiadomo, ktore migracje uruchomic.
spring.flyway.enabled=false
#
# spring.jpa.open-in-view celowo NIE jest tu ustawione: lekcja Rel04LazyLoading pokazuje zachowanie DOMYSLNE
# (wlaczone + ostrzezenie w logu). Lekcja webowa Rel06EntityToDto wylacza je jawnie w swoim profilu.
