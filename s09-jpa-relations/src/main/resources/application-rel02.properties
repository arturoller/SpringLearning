# Profil lekcji Rel02OneToMany (wlaczany w Rel02Application i w testach przez @ActiveProfiles("rel02")).
# Modul ma Spring MVC (potrzebny lekcjom Rel04 i Rel06), ale ta lekcja nie potrzebuje serwera WWW:
# aplikacja lekcji nie startuje Tomcata (nie zajmuje portu 8080) - wykona migracje, sprawdzi encje i zakonczy dzialanie.
spring.main.web-application-type=none
# Wlasna baza H2 w pamieci — lekcje nie dziela danych.
spring.datasource.url=jdbc:h2:mem:rel02
# Schemat tworzy WYLACZNIE Flyway (migracje lekcji), a Hibernate tylko SPRAWDZA, czy encje pasuja do tabel.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/rel02
spring.jpa.hibernate.ddl-auto=validate
# Wypisywanie SQL (tylko do nauki).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
