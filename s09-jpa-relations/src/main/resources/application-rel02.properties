# Ustawienia lekcji Rel02OneToMany (profil "rel02"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:rel02
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/rel02
# Schemat tworzy Flyway; Hibernate tylko go sprawdza (s08_data_jpa/Jpa06FlywayWithJpa).
spring.jpa.hibernate.ddl-auto=validate
# Statystyki Hibernate — testy liczą nimi wysłane polecenia SQL i wczytane encje.
spring.jpa.properties.hibernate.generate_statistics=true
# Podgląd SQL — w tym dziale zawsze patrz, co naprawdę poszło do bazy.
logging.level.org.hibernate.SQL=debug
