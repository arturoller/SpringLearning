# Profil lekcji Rel03ManyToMany (wlaczany w Rel03Application i w testach przez @ActiveProfiles("rel03")).
# Wlasna baza H2 w pamieci — lekcje nie dziela danych.
spring.datasource.url=jdbc:h2:mem:rel03
# Schemat tworzy WYLACZNIE Flyway (migracje lekcji), a Hibernate tylko SPRAWDZA, czy encje pasuja do tabel.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/rel03
spring.jpa.hibernate.ddl-auto=validate
# Wypisywanie SQL (tylko do nauki).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Statystyki Hibernate (liczniki zapytan) - test sekcji 2 liczy instrukcje SQL przy usuwaniu z List i z Set.
spring.jpa.properties.hibernate.generate_statistics=true
