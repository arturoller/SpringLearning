# Profil lekcji Rel05NPlusOne (wlaczany w Rel05Application i w testach przez @ActiveProfiles("rel05")).
# Modul ma Spring MVC (potrzebny lekcjom Rel04 i Rel06), ale ta lekcja nie potrzebuje serwera WWW:
# aplikacja lekcji nie startuje Tomcata (nie zajmuje portu 8080) - wykona migracje, sprawdzi encje i zakonczy dzialanie.
spring.main.web-application-type=none
# Wlasna baza H2 w pamieci - lekcje nie dziela danych.
spring.datasource.url=jdbc:h2:mem:rel05
# Schemat i dane startowe tworzy WYLACZNIE Flyway (migracje lekcji), a Hibernate tylko SPRAWDZA, czy encje pasuja do tabel.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/rel05
spring.jpa.hibernate.ddl-auto=validate
# Wypisywanie SQL (tylko do nauki).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Statystyki Hibernate - cala lekcja mierzy problem N+1 LICZBA zapytan (Statistics.getPrepareStatementCount()).
spring.jpa.properties.hibernate.generate_statistics=true
