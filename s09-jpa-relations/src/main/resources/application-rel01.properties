# Profil lekcji Rel01ManyToOne (wlaczany w Rel01Application i w testach przez @ActiveProfiles("rel01")).
# Wlasna baza H2 w pamieci — lekcje nie dziela danych.
spring.datasource.url=jdbc:h2:mem:rel01
# Schemat tworzy WYLACZNIE Flyway (migracje lekcji), a Hibernate tylko SPRAWDZA, czy encje pasuja do tabel.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/rel01
spring.jpa.hibernate.ddl-auto=validate
# Wypisywanie SQL (tylko do nauki).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Statystyki Hibernate (liczniki zapytan) - test sekcji 2 liczy, ile SELECT-ow wysyla EAGER w zapytaniu JPQL.
spring.jpa.properties.hibernate.generate_statistics=true
