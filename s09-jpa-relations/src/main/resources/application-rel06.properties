# Profil lekcji Rel06EntityToDto (wlaczany w Rel06Application i w testach przez @ActiveProfiles("rel06")).
# Lekcja jest aplikacja WEBOWA (kontrolery REST zwracajace encje i DTO).
# DOBRA PRAKTYKA z lekcji Rel04LazyLoading: open-in-view WYLACZONE - sesja Hibernate konczy sie razem z transakcja serwisu.
spring.jpa.open-in-view=false
# Wlasna baza H2 w pamieci - lekcje nie dziela danych.
spring.datasource.url=jdbc:h2:mem:rel06
# Schemat i dane startowe tworzy WYLACZNIE Flyway (migracje lekcji), a Hibernate tylko SPRAWDZA, czy encje pasuja do tabel.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/rel06
spring.jpa.hibernate.ddl-auto=validate
# Wypisywanie SQL (tylko do nauki).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Statystyki Hibernate - testy licza zapytania wyslane przy budowaniu odpowiedzi.
spring.jpa.properties.hibernate.generate_statistics=true
