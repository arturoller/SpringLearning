# Standardowy plik komunikatów Hibernate Validatora (nazwa i miejsce są wymagane: korzeń classpath). Dotyczy CAŁEGO modułu,
# dlatego wszystkie klucze lekcji Val04 mają prefiks val04. Plik czytany jest jako UTF-8 (Java 9+).
val04.sku.invalid=Kod produktu musi mieć postać ABC-1234 (trzy duże litery, myślnik, cztery cyfry), a podano: ${validatedValue}
val04.phone.invalid=Numer telefonu: 9-12 cyfr, opcjonalnie z plusem na początku
val04.promotion.range=Promocja nie może kończyć się przed początkiem
val04.category.unknown=Nieznana kategoria "${validatedValue}"; dostępne: {categories}
val04.name.short=Nazwa musi mieć co najmniej {min} znaki (zażółć gęślą jaźń)
