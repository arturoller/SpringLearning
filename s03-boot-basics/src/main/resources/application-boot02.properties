# Profil lekcji Boot02WritingAutoConfiguration (włączany w Boot02Application i w testach przez @ActiveProfiles("boot02")).
# Bezpiecznik naszej autokonfiguracji: bez tej linii Boot02GreetingAutoConfiguration jest pomijana.
boot02.greeting.enabled=true
