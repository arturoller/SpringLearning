# Profil lekcji Jdbc02JdbcTemplate. Baza H2 w pamięci o własnej nazwie; DB_CLOSE_DELAY=-1 = baza żyje, dopóki żyje JVM
# (bez tego znikałaby przy zamknięciu ostatniego połączenia, a pula połączeń potrafi je zamykać i otwierać).
spring.datasource.url=jdbc:h2:mem:jdbc02;DB_CLOSE_DELAY=-1
# Schemat i dane wskazujemy plikami tej lekcji (domyślnie Boot szuka schema.sql i data.sql w korzeniu classpath).
spring.sql.init.schema-locations=classpath:db/jdbc02/schema.sql
spring.sql.init.data-locations=classpath:db/jdbc02/data.sql
spring.sql.init.encoding=UTF-8
# Ta lekcja nie uczy Flyway, a jego starter jest na classpath modułu — wyłączamy.
spring.flyway.enabled=false
