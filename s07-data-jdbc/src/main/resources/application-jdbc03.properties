# Profil lekcji Jdbc03SqlInit. Baza H2 w pamięci o własnej nazwie (testy lekcji podmieniają nazwę argumentem --spring.datasource.url=...).
spring.datasource.url=jdbc:h2:mem:jdbc03;DB_CLOSE_DELAY=-1
# Skrypty lekcji leżą w katalogu db/jdbc03 (domyślnie Boot szukałby schema.sql i data.sql w korzeniu classpath —
# a tam byłyby wspólne dla WSZYSTKICH lekcji modułu).
spring.sql.init.schema-locations=classpath:db/jdbc03/schema.sql
spring.sql.init.data-locations=classpath:db/jdbc03/data.sql
spring.sql.init.encoding=UTF-8
# Ta lekcja nie uczy Flyway (lekcja Jdbc04Flyway) — wyłączamy go.
spring.flyway.enabled=false
