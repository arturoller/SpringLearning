# Profil lekcji Jdbc03SqlInit: skrypty startowe z katalogu db/jdbc03 (nie z domyslnych schema.sql/data.sql w korzeniu).
#
# mode=always: uruchom skrypty ZAWSZE (domyslnie jest "embedded" - tylko dla baz wbudowanych jak H2).
# Skrypty schema-locations idą PIERWSZE, dopiero po nich data-locations.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/jdbc03/schema.sql
spring.sql.init.data-locations=classpath:db/jdbc03/data.sql
