# Profil lekcji Jdbc05Repository. Baza H2 w pamięci o własnej nazwie (DB_CLOSE_DELAY=-1: baza żyje, dopóki żyje JVM).
spring.datasource.url=jdbc:h2:mem:jdbc05;DB_CLOSE_DELAY=-1
# Schemat i dane tworzy Flyway — migracje TEJ lekcji (nie wspólny katalog db/migration).
spring.flyway.locations=classpath:db/migration/jdbc05
# Flyway zastępuje schema.sql/data.sql, więc wyłączamy inicjalizację skryptami.
spring.sql.init.mode=never
