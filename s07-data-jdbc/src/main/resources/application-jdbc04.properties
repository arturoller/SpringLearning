# Ustawienia lekcji Jdbc04Flyway (profil "jdbc04"): własna baza w pamięci i WŁĄCZONY Flyway z migracjami tej lekcji.
# Wspólny application.properties modułu wyłącza Flyway celowo — każda lekcja włącza go sobie sama.
spring.datasource.url=jdbc:h2:mem:jdbc04
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/jdbc04
# Włącza bean Jdbc04StartupReport (czyta tabelę product przy starcie — działa tylko, gdy migracje już poszły).
jdbc04.report=true
