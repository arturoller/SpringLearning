# Profil lekcji Jdbc04Flyway: Flyway wlaczony, migracje tylko z katalogu tej lekcji.
# Domyslna lokalizacja Flyway w Bootcie to classpath:db/migration - tutaj celowo wskazujemy PODKATALOG lekcji,
# zeby inne lekcje tego modulu nie wykonaly cudzych migracji.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/jdbc04
# skrypty schema.sql/data.sql zostaja wylaczone (spring.sql.init.mode=never ze wspolnego application.properties):
# Flyway i spring.sql.init nie powinny zarzadzac ta sama baza.
