# Profil lekcji Jdbc04Flyway. Baza H2 w pamięci o własnej nazwie (DB_CLOSE_DELAY=-1: baza żyje, dopóki żyje JVM).
spring.datasource.url=jdbc:h2:mem:jdbc04;DB_CLOSE_DELAY=-1
# Flyway jest włączony domyślnie (starter flyway na classpath); wskazujemy katalog migracji TEJ lekcji.
# Domyślnie Flyway szuka w classpath:db/migration — wspólnym dla wszystkich lekcji modułu, więc go nie używamy.
spring.flyway.locations=classpath:db/migration/jdbc04
# Dwa narzędzia do tworzenia schematu naraz to kłopoty: wyłączamy skrypty schema.sql/data.sql.
spring.sql.init.mode=never
