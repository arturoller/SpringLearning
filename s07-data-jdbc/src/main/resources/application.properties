# Wspolne ustawienia modulu s07-data-jdbc - celowo minimalne i BEZPIECZNE.
#
# Starter flyway i autokonfiguracja sql.init dzialaja w KAZDEJ lekcji tego modulu (wspolny classpath),
# wiec domyslnie je WYLACZAMY. Kazda lekcja wlacza to, czego potrzebuje, we wlasnym profilu:
# application-jdbc01.properties, application-jdbc02.properties itd. (profil aktywuje klasa startowa lekcji
# albo adnotacja @ActiveProfiles w tescie).
#
# Baze H2 w pamieci Boot tworzy z UNIKALNA nazwa dla kazdego kontekstu (spring.datasource.generate-unique-name=true
# domyslnie), wiec lekcje nie widza nawzajem swoich tabel.
#
# UWAGA: Spring Boot czyta pliki .properties jako ISO-8859-1, dlatego w WARTOSCIACH nie ma polskich znakow.
spring.flyway.enabled=false
spring.sql.init.mode=never
