# Ustawienia lekcji Jdbc01JdbcClient (profil "jdbc01" — włącza go Jdbc01Application i @ActiveProfiles w testach).
spring.datasource.url=jdbc:h2:mem:jdbc01
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:jdbc01/schema.sql
spring.sql.init.data-locations=classpath:jdbc01/data.sql
