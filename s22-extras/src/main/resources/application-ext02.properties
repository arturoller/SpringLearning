# Profil lekcji Ext02Messaging — włączany w Ext02Application.main i w teście z kontenerem Kafki (@ActiveProfiles).

# Adres brokera (w teście nadpisuje go @ServiceConnection — adres kontenera na losowym porcie).
spring.kafka.bootstrap-servers=localhost:9092

# Klucz: String (domyślne StringSerializer/StringDeserializer). Wartość: JSON przez Jackson 3.
# Spring Kafka 4: JacksonJsonSerializer/JacksonJsonDeserializer. Stare JsonSerializer/JsonDeserializer są przestarzałe
# i potrzebują Jacksona 2, którego Boot 4 nie dostarcza (NoClassDefFoundError: com/fasterxml/jackson/...).
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Deserializator tworzy obiekt klasy z nagłówka __TypeId__ — tylko z ZAUFANYCH pakietów (inaczej IllegalArgumentException
# „...is not in the trusted packages: [java.util, java.lang]...”). Nigdy „*” dla wiadomości z obcych źródeł.
spring.kafka.consumer.properties.spring.json.trusted.packages=s22_extras.ext02_messaging

# Nowa grupa konsumentów (bez zapisanej pozycji) czyta temat OD POCZĄTKU (domyślnie: latest — tylko nowe wiadomości).
spring.kafka.consumer.auto-offset-reset=earliest
