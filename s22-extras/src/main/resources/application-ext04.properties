# Profil lekcji Ext04Tracing — włączany w Ext04Application.main. Testy lekcji go NIE włączają (nie mogą wysyłać
# śladów do zewnętrznego serwera) — mają własne ustawienia i eksporter w pamięci.

# Nazwa usługi w śladach (atrybut service.name). Bez niej: „unknown_service”.
spring.application.name=sklep-ext04

# Próbkowanie (sampling): jaki ułamek śladów zapisać. Domyślnie 0.1 = 10% — przy nauce wyglądałoby, że „nic nie działa”.
# Na produkcji przy dużym ruchu zostaw mało (koszt przechowywania), lokalnie 1.0 = każdy ślad.
management.tracing.sampling.probability=1.0

# Eksport śladów protokołem OTLP przez HTTP (Jaeger z s22-extras/compose/ext04/compose.yaml przyjmuje go na porcie 4318).
# Dopiero ta właściwość sprawia, że Boot tworzy eksporter OTLP — bez niej ślady nie wychodzą z aplikacji.
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
