# Profil lekcji Ext01SpringAi — włączany w Ext01Application.main (setAdditionalProfiles("ext01")).
# Testy lekcji go NIE włączają (poza jednym testem konfiguracji) — używają atrapy ChatModel.

# Włącz autokonfigurację Ollamy (moduł ma domyślnie spring.ai.model.chat=none).
spring.ai.model.chat=ollama

# Adres serwera Ollama (domyślny to ten sam — zapisany jawnie, żeby było widać, skąd się bierze).
spring.ai.ollama.base-url=http://localhost:11434

# Model — mały (ok. 1,3 GB), działa bez karty graficznej. Bez tej właściwości Spring AI 2.0.1 używa modelu „mistral”.
# Uwaga: dawniej (Spring AI 1.x) było spring.ai.ollama.chat.options.model — w 2.0 ta nazwa jest przestarzała.
spring.ai.ollama.chat.model=llama3.2:1b
spring.ai.ollama.chat.temperature=0.2

# Ponawianie (retry): domyślnie do 10 prób z odstępem od 2 s mnożonym ×5 — przy wyłączonej Ollamie zapytanie
# czekałoby bardzo długo. Na potrzeby nauki: 2 próby i krótki odstęp.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=500ms
