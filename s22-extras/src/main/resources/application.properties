# Wspólne ustawienia modułu s22-extras — MINIMALNE. Każda lekcja ma własny profil application-extNN.properties,
# włączany w jej klasie startowej (ExtNNApplication), albo ustawienia w @SpringBootTest(properties = ...).
#
# Ten moduł łączy startery, które zmieniają CAŁĄ aplikację (Spring AI, Kafka, OAuth2 Resource Server, OpenTelemetry,
# WebFlux). Dlatego tu wyłączamy to, co bez wyłączenia przeszkadzałoby KAŻDEJ lekcji (sprawdzone uruchomieniem):

# 1. Eksport metryk OTLP (micrometer-registry-otlp ze startera opentelemetry) jest domyślnie WŁĄCZONY: co minutę
#    wysyła metryki na http://localhost:4318/v1/metrics, a bez odbiorcy loguje
#    WARN „Failed to publish metrics to OTLP receiver”. Lekcje nie potrzebują eksportu metryk.
management.otlp.metrics.export.enabled=false

# 2. Spring AI: dostawcę modelu czatu wybiera spring.ai.model.chat (embeddingów: spring.ai.model.embedding).
#    Bez tej właściwości autokonfiguracja Ollamy DZIAŁA (matchIfMissing). "none" = nie uruchamia się (brak beana
#    OllamaChatModel). Profil ext01 (lekcja o Spring AI) włącza ją z powrotem: spring.ai.model.chat=ollama.
spring.ai.model.chat=none
spring.ai.model.embedding=none
