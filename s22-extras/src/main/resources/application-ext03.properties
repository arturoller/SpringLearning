# Profil lekcji Ext03OAuth2Keycloak — włączany w Ext03Application.main i w testach lekcji (@ActiveProfiles).

# Wystawca tokenów: dziedzina (realm) „sklep” w Keycloaku z s22-extras/compose/ext03/compose.yaml (port 8180).
# Boot tworzy z tego JwtDecoder, który:
#   • pobiera konfigurację z {issuer-uri}/.well-known/openid-configuration i klucze publiczne (JWKS) — LENIWIE,
#     przy pierwszym tokenie, a nie przy starcie (aplikacja i testy wstają bez Keycloaka),
#   • sprawdza podpis, ważność (exp) i wystawcę: claim „iss” musi być DOKŁADNIE równy temu adresowi.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/sklep
