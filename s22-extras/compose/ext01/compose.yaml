# Lekcja s22_extras / Ext01SpringAi — lokalny serwer modeli Ollama (do RĘCZNEGO uruchomienia, testy go nie potrzebują).
#
#   docker compose -f s22-extras/compose/ext01/compose.yaml up -d      ← start (port 11434)
#   docker exec ext01-ollama ollama pull llama3.2:1b                    ← pobranie modelu (ok. 1,3 GB, tylko raz)
#   docker exec ext01-ollama ollama list                                ← jakie modele są pobrane
#   docker compose -f s22-extras/compose/ext01/compose.yaml down       ← stop (modele zostają w wolumenie)
#
# Model działa na procesorze (bez karty graficznej) — odpowiedź może trwać kilka sekund. Potrzeba ok. 2–3 GB wolnej pamięci.
# Obraz z JAWNYM tagiem (nigdy „latest” — jutro mógłby to być inny program).
services:
  ollama:
    image: ollama/ollama:0.13.0
    container_name: ext01-ollama
    ports:
      - "11434:11434"
    volumes:
      - ext01-ollama-models:/root/.ollama   # pobrane modele przetrwają usunięcie kontenera

volumes:
  ext01-ollama-models:
