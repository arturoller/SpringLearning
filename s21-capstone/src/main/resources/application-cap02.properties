# Profil projektu Cap02Reservations (wlaczany w Cap02Application i w testach przez @ActiveProfiles("cap02")).
spring.datasource.url=jdbc:h2:mem:cap02
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/cap02
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
#
# ZEGAR DEMONSTRACYJNY: aplikacja "zyje" w chwili 2026-10-19 10:00 (czas polski). Dane startowe, scenariusz z pliku
# http/cap02_reservations.http i testy licza na te date - dzieki temu dzialaja tak samo dzis i za rok.
# Usun te linie, a aplikacja uzyje prawdziwego zegara (Clock.system). W PRODUKCJI ta wlasciwosc NIE MOZE byc ustawiona.
cap02.clock.fixed=2026-10-19T10:00
