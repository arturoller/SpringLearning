# Profil projektu Cap03LibraryWithAuth (wlaczany w Cap03Application i w testach przez @ActiveProfiles("cap03")).
spring.datasource.url=jdbc:h2:mem:cap03
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/cap03
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
#
# Zasady biblioteki (@ConfigurationProperties LibraryRules) - zmiana bez kompilacji (s02_configuration).
cap03.library.loan-days=14
cap03.library.fine-per-day=0.50
cap03.library.max-active-loans=3
#
# ZEGAR DEMONSTRACYJNY: "teraz" = 2026-10-19 10:00 (czas polski). Kary w danych startowych, scenariusz .http i testy
# licza na te date. Tokeny JWT tez sa wystawiane i sprawdzane tym zegarem. W PRODUKCJI ta wlasciwosc NIE MOZE byc ustawiona.
cap03.clock.fixed=2026-10-19T10:00
