# Profil projektu Cap01ShopApi (wlaczany w Cap01Application i w testach przez @ActiveProfiles("cap01")).
# Wlasna baza H2 w pamieci - projekty nie dziela danych.
spring.datasource.url=jdbc:h2:mem:cap01
# Schemat i dane startowe tworzy WYLACZNIE Flyway, a Hibernate tylko SPRAWDZA, czy encje pasuja do tabel.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/cap01
spring.jpa.hibernate.ddl-auto=validate
# Sesja Hibernate konczy sie razem z transakcja serwisu (s09_jpa_relations/Rel04LazyLoading) - DTO buduje serwis.
spring.jpa.open-in-view=false
# Wypisywanie SQL - tylko do nauki (w produkcji: wylaczone).
spring.jpa.show-sql=true
