# Profil lekcji Mod02ModuleEvents. Własna baza H2 w pamięci (DB_CLOSE_DELAY=-1: baza żyje, dopóki żyje JVM).
spring.datasource.url=jdbc:h2:mem:mod02;DB_CLOSE_DELAY=-1
# Schemat (także tabelę EVENT_PUBLICATION rejestru zdarzeń) tworzy Flyway — migracje TEJ lekcji.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mod02
# Spring Modulith 2.1 domyślnie SAM tworzy tabelę EVENT_PUBLICATION (CREATE TABLE IF NOT EXISTS) przy starcie.
# Wyłączamy to: schematem bazy rządzi wyłącznie Flyway (migracja V2), więc w każdej bazie jest ta sama, znana wersja.
spring.modulith.events.jdbc.schema-initialization.enabled=false
