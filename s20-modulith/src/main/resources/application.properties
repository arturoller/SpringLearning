# Wspólny plik modułu s20-modulith jest celowo prawie pusty: ustawienia każdej lekcji leżą w pliku
# application-modNN.properties (profil lekcji, włączany w jej klasie startowej i w testach przez @ActiveProfiles),
# a baza H2 każdej lekcji ma własną nazwę (jdbc:h2:mem:modNN) — lekcje nie wchodzą sobie w drogę.
spring.main.banner-mode=off
# Flyway domyślnie WYŁĄCZONY: bez profilu lekcji szukałby migracji we wspólnym katalogu classpath:db/migration.
# Lekcja, która używa migracji (Mod02ModuleEvents), włącza go w swoim profilu i podaje własny katalog.
spring.flyway.enabled=false
