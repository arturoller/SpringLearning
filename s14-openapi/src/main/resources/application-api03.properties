# Ustawienia lekcji s14_openapi / Api03GroupsAndVersions - profil "api03".
# Wlacza go Api03Application (przy starcie) i testy lekcji (@ActiveProfiles("api03")).

# Wersjonowanie API wbudowane w Spring Framework 7 (patrz s04_web_rest/Rest07ApiVersioning):
# wersje czytamy z naglowka API-Version; zapytanie bez wersji dostaje wersje domyslna 1.0.
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1.0
