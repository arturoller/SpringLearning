# Ustawienia lekcji s04_web_rest / Rest07ApiVersioning — profil „rest07”.
# Włącza go Rest07Application (przy starcie) i testy lekcji (@ActiveProfiles("rest07")). Inne lekcje działu go nie widzą.

# Skąd brać wersję API z zapytania: najpierw nagłówek API-Version, a gdy go brak — parametr ?version=...
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.use.query-parameter=version

# Wersja dla zapytań bez wersji (stare klienty). Gdy jest wersja domyślna, wersja NIE jest wymagana.
spring.mvc.apiversion.default=1.0

# Wspierane wersje: te z mapowań (1.0, 1.1, 2.0) Spring wykrywa sam; 1.5 dopisujemy ręcznie — to wersja API,
# w której zmieniło się coś w innej części sklepu, a produkty obsługuje dla niej wersja bazowa „1.0+”.
spring.mvc.apiversion.supported=1.5
