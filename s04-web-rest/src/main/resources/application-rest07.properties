# Profil lekcji Rest07ApiVersioning (włącza go Rest07Application i testy lekcji przez @ActiveProfiles("rest07")).
# Inne lekcje działu tego profilu nie włączają, więc wersjonowanie ich nie dotyczy.

# Skąd brać wersję: z nagłówka API-Version (use = użyj; header = nagłówek)
spring.mvc.apiversion.use.header=API-Version
# Wersja przyjmowana, gdy klient jej nie poda (default = domyślna)
spring.mvc.apiversion.default=1.0
