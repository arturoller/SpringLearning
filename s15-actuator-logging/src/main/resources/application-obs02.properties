# Ustawienia lekcji Obs02HealthIndicators (profil "obs02", włączany w Obs02Application).
management.endpoints.web.exposure.include=health
# szczegóły widoczne dla każdego — w prawdziwej aplikacji: when-authorized albo osobny port zarządzania
management.endpoint.health.show-details=always
# własna grupa zdrowia "sklep": tylko magazyn i ping, z własnym ustawieniem szczegółów
management.endpoint.health.group.sklep.include=warehouse,ping
management.endpoint.health.group.sklep.show-details=always
