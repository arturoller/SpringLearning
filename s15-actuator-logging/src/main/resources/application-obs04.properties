# Ustawienia lekcji Obs04Logging (profil "obs04", włączany w Obs04Application).
management.endpoints.web.exposure.include=health,loggers
# własny wzorzec konsoli z identyfikatorem zapytania z MDC (%X{requestId}); ":-brak" = wartość, gdy MDC jest puste
logging.pattern.console=%d{HH:mm:ss.SSS} %5p [%X{requestId:-brak}] %logger{25} : %m%n
# poziom dla jednego pakietu (DEBUG pokaże szczegóły z CheckoutService i PaymentService)
logging.level.s15_actuator_logging.obs04_logging=DEBUG
# inne przykłady (odkomentuj i uruchom ponownie):
# logging.structured.format.console=ecs
