# Ustawienia lekcji Obs01Actuator (profil "obs01", włączany w Obs01Application).
# Wystawiamy przez HTTP punkty końcowe do nauki. W prawdziwej aplikacji NIE rób tego z env/beans bez zabezpieczeń!
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,beans,conditions
management.endpoint.health.show-details=always
# info z danych aplikacji: Boot czyta właściwości info.* dopiero po włączeniu tego współtwórcy (domyślnie wyłączony)
management.info.env.enabled=true
info.app.name=Sklep SpringLearning
info.app.version=1.0-nauka
info.app.owner=zespol-sklepu
