# Profil lekcji Test06Testcontainers (włączany przez Test06Application i @ActiveProfiles("test06") w testach).
# Schemat i dane z plików SQL lekcji — ZAWSZE (mode=always), bo PostgreSQL w kontenerze nie jest bazą wbudowaną,
# a domyślny tryb (embedded) uruchamia skrypty tylko na bazach wbudowanych (H2).
# Flyway zostaje wyłączony (application.properties modułu) — dlaczego: lekcja, sekcja 4.
# Adresu bazy tu NIE MA: na H2 Boot tworzy bazę wbudowaną sam, a PostgreSQL podaje @ServiceConnection.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/test06/schema.sql
spring.sql.init.data-locations=classpath:db/test06/data.sql
