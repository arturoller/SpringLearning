# Ustawienia lekcji Test06Testcontainers (profil "test06"): domyślnie H2 w pamięci. W testach z kontenerem adres,
# użytkownika i hasło PostgreSQL podaje @ServiceConnection (albo @DynamicPropertySource) — te wartości wygrywają.
spring.datasource.url=jdbc:h2:mem:test06
spring.flyway.enabled=true
# Migracje są napisane w SQL zgodnym z OBIEMA bazami (H2 i PostgreSQL), więc wystarcza jedna lokalizacja.
spring.flyway.locations=classpath:db/migration/test06
spring.jpa.hibernate.ddl-auto=validate
