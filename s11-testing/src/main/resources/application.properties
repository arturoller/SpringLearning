# Wspolne ustawienia modulu s11-testing - celowo MINIMALNE i BEZPIECZNE.
#
# Wszystkie lekcje dzialu dziela ten sam classpath (startery webmvc, data-jpa, flyway, docker-compose).
# Dlatego domyslnie WYLACZAMY to, co dzialaloby "samo" w kazdej lekcji:
#  - Flyway szukalby migracji w classpath:db/migration - wlaczaja go tylko lekcje, ktore go uzywaja (profil lekcji);
#  - Docker Compose probowalby uruchomic "docker compose up" przy starcie KAZDEJ aplikacji lekcji (w testach Boot
#    i tak go pomija: spring.docker.compose.skip.in-tests=true domyslnie) - wlacza go tylko profil lekcji Test07.
#
# Baze H2 w pamieci Boot tworzy z UNIKALNA nazwa dla kazdego kontekstu (spring.datasource.generate-unique-name=true
# domyslnie), wiec lekcje i rozne konteksty testow nie widza nawzajem swoich tabel.
#
# open-in-view=false: nie trzymaj sesji JPA otwartej przez cale zapytanie HTTP (i nie wypisuj ostrzezenia o tym).
#
# UWAGA: Spring Boot czyta pliki .properties jako ISO-8859-1, dlatego w WARTOSCIACH nie ma polskich znakow.
spring.flyway.enabled=false
spring.docker.compose.enabled=false
spring.jpa.open-in-view=false
