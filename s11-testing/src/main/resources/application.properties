# Wspólne ustawienia modułu s11-testing — celowo MINIMALNE i BEZPIECZNE.
#
# Wszystkie lekcje działu dzielą tę samą ścieżkę klas (startery webmvc, data-jpa, flyway, docker-compose).
# Dlatego domyślnie WYŁĄCZAMY to, co działałoby „samo” w każdej lekcji:
#  - Flyway szukałby migracji w classpath:db/migration — włączają go tylko lekcje, które go używają (profil lekcji);
#  - obsługa Docker Compose próbowałaby uruchomić „docker compose up” przy starcie KAŻDEJ aplikacji lekcji
#    (w testach Boot i tak ją pomija: spring.docker.compose.skip.in-tests=true domyślnie) — włącza ją tylko
#    profil lekcji Test07 (application-test07.properties).
#
# Bazę H2 w pamięci Boot tworzy z UNIKALNĄ nazwą dla każdego kontekstu (spring.datasource.generate-unique-name=true
# domyślnie), więc lekcje i różne konteksty testów nie widzą nawzajem swoich tabel.
#
# open-in-view=false: nie trzymaj sesji JPA otwartej przez całe zapytanie HTTP (i nie wypisuj ostrzeżenia o tym).
# W wartościach nie używamy polskich znaków (komentarze mogą je mieć — Spring je pomija).
spring.main.banner-mode=off
spring.flyway.enabled=false
spring.docker.compose.enabled=false
spring.jpa.open-in-view=false
