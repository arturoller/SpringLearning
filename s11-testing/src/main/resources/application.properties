# Wspólny plik modułu s11-testing jest celowo prawie pusty.
# IZOLACJA LEKCJI: Flyway działałby dla KAŻDEJ lekcji w module (wspólny classpath), dlatego jest tu domyślnie
# WYŁĄCZONY — każda lekcja włącza go sama ze swoją lokalizacją migracji (application-testNN.properties).
spring.main.banner-mode=off
spring.flyway.enabled=false
# Docker Compose (spring-boot-docker-compose jest na classpath modułu): bez pliku compose.yaml start KAŻDEJ aplikacji
# lekcji kończy się błędem "No Docker Compose file found". Dlatego domyślnie jest WYŁĄCZONY; lekcja
# Test07DockerCompose włącza go we własnym profilu (application-test07.properties).
spring.docker.compose.enabled=false
