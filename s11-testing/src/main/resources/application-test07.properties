# Ustawienia lekcji Test07DockerCompose (profil "test07").
# Wspólny application.properties WYŁĄCZA Docker Compose dla wszystkich lekcji — tu włączamy go z powrotem.
spring.docker.compose.enabled=true
# Ścieżkę do pliku (compose-test07.yaml) ustawia Test07Application przez ComposeFile.locate() — ścieżka względna
# liczy się od katalogu roboczego, a ten jest inny w IntelliJ i w ./mvnw (patrz lekcja, sekcja 1).
# Cykl życia: start-and-stop (domyślny) = "docker compose up" przy starcie aplikacji, zatrzymanie przy jej końcu.
spring.docker.compose.lifecycle-management=start-and-stop
# stop (domyślne) zatrzymuje kontener, ale go NIE usuwa — dane w bazie przetrwają do następnego uruchomienia.
spring.docker.compose.stop.command=stop
# NIE MA tu spring.datasource.url/username/password — Boot bierze je z usługi "postgres" z pliku compose.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/test07
spring.jpa.hibernate.ddl-auto=validate
