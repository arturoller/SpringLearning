# Profil lekcji Test07DockerCompose (włączany przez Test07Application i @ActiveProfiles("test07") w testach).
# To JEDYNE miejsce w module, które włącza obsługę Docker Compose (application.properties modułu ją wyłącza).
spring.docker.compose.enabled=true
# Plik lekcji. Ścieżka względem katalogu roboczego aplikacji = katalog modułu s11-testing
# (tak uruchamia ./mvnw -pl s11-testing spring-boot:run i IntelliJ przy domyślnym „Working directory”).
spring.docker.compose.file=compose/test07/compose.yaml
# Cykl życia: start-and-stop (domyślne) — „up” przy starcie aplikacji, polecenie stop przy jej zamknięciu.
spring.docker.compose.lifecycle-management=start-and-stop
# Przy zamknięciu „down” (usuń kontenery) zamiast domyślnego „stop” (zatrzymaj, zostaw) — każde uruchomienie
# zaczyna od świeżej bazy, a skrypty SQL poniżej mogą zawsze tworzyć tabelę od zera.
spring.docker.compose.stop.command=down
spring.docker.compose.stop.arguments=--volumes
# Schemat i dane: zawsze (PostgreSQL z Compose nie jest bazą wbudowaną). W testach Compose jest pomijany i baza to H2.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/test07/schema.sql
spring.sql.init.data-locations=classpath:db/test07/data.sql
