# Ustawienia lekcji Test04DataJpaTest (profil "test04"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:test04
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/test04
# Schemat tworzy Flyway; Hibernate przy starcie tylko SPRAWDZA, czy encje pasują do tabel.
spring.jpa.hibernate.ddl-auto=validate
