# Profil lekcji Test04DataJpaTest (włączany przez Test04Application i @ActiveProfiles("test04") w testach).
# Własna baza H2 lekcji i własny katalog migracji Flyway; Hibernate tylko SPRAWDZA zgodność encji z tabelą.
# W @DataJpaTest adres z tej linii jest domyślnie IGNOROWANY — wycinek podmienia bazę na świeżą wbudowaną
# (sekcja 5 lekcji); z @AutoConfigureTestDatabase(replace = NONE) test używa właśnie jdbc:h2:mem:test04.
spring.datasource.url=jdbc:h2:mem:test04
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/test04
spring.jpa.hibernate.ddl-auto=validate
