# Ustawienia lekcji Test01TestSlices (profil "test01"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:test01
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/test01
# Schemat tworzy Flyway; Hibernate przy starcie tylko SPRAWDZA, czy encje pasują do tabel.
spring.jpa.hibernate.ddl-auto=validate
