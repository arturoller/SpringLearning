# Profil lekcji Evt01ApplicationEvents. Lekcja nie używa bazy, ale starter JDBC jest na ścieżce klas modułu,
# więc nadajemy bazie H2 własną nazwę, a Flyway wyłączamy (nie ma tu migracji do wykonania).
spring.datasource.url=jdbc:h2:mem:evt01;DB_CLOSE_DELAY=-1
spring.flyway.enabled=false
spring.sql.init.mode=never
