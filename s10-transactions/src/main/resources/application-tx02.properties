# Ustawienia lekcji Tx02Propagation (profil "tx02"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:tx02
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/tx02
# Lekcja używa tylko JdbcClient (bez encji), ale JPA jest na ścieżce klas — menedżerem transakcji jest
# JpaTransactionManager. validate przy braku encji niczego nie sprawdza; zostawiamy dla spójności działu.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Podgląd propagacji (zawieszanie, savepointy, dołączanie) — odkomentuj:
#logging.level.org.springframework.orm.jpa.JpaTransactionManager=debug
#logging.level.org.springframework.jdbc.support.JdbcTransactionManager=debug
