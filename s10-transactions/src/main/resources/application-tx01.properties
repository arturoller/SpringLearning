# Profil lekcji Tx01Transactional (wlaczany w Tx01Application i w testach przez @ActiveProfiles("tx01")).
# Wlasna baza H2 w pamieci — lekcje nie dziela danych.
spring.datasource.url=jdbc:h2:mem:tx01
# Schemat tworzy Flyway (migracje lekcji), a Hibernate tylko SPRAWDZA, czy encje pasuja do tabel (validate).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/tx01
spring.jpa.hibernate.ddl-auto=validate
# DEBUG menedzera transakcji: w logu widac "Creating new transaction", "Committing", "Rolling back".
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
