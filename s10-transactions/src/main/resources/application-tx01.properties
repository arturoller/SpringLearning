# Ustawienia lekcji Tx01Transactional (profil "tx01"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:tx01
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/tx01
# Schemat tworzy Flyway; Hibernate tylko go sprawdza (s08_data_jpa/Jpa06FlywayWithJpa).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Podgląd pracy menedżera transakcji (sekcja 2 lekcji) — odkomentuj, a w logu zobaczysz begin/commit/rollback:
#logging.level.org.springframework.orm.jpa.JpaTransactionManager=debug
