# Wspolne ustawienia modulu s10-transactions — celowo MINIMALNE i BEZPIECZNE.
# Kazda lekcja ma wlasny plik application-<lekcja>.properties (profil), np. application-tx01.properties,
# wlaczany przez klase startowa lekcji (setAdditionalProfiles) i w testach przez @ActiveProfiles.
# Tam sa: wlasna baza H2 (jdbc:h2:mem:txNN), wlasne migracje Flyway (db/migration/txNN) i ddl-auto=validate.
#
# Flyway domyslnie WYLACZONY: bez profilu lekcji szukalby migracji w classpath:db/migration (wspolnym dla wszystkich).
spring.flyway.enabled=false
