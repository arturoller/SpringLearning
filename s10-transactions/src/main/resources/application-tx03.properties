# Ustawienia lekcji Tx03ProxyPitfalls (profil "tx03"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:tx03
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/tx03
# Lekcja używa tylko JdbcClient (bez encji); menedżerem transakcji i tak jest JpaTransactionManager (JPA na ścieżce klas).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
