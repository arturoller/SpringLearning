# Ustawienia lekcji Tx05ProgrammaticTransactions (profil "tx05"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:tx05
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/tx05
# Lekcja używa tylko JdbcClient (bez encji), ale JPA jest na ścieżce klas — menedżerem transakcji jest
# JpaTransactionManager. validate przy braku encji niczego nie sprawdza; zostawiamy dla spójności działu.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Podgląd: begin/commit/rollback wywoływane przez TransactionTemplate i ręcznie przez PlatformTransactionManager —
# odkomentuj:
#logging.level.org.springframework.orm.jpa.JpaTransactionManager=debug
