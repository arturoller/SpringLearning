# Profil lekcji Tx05ProgrammaticTransactions (wlaczany w Tx05Application i w testach przez @ActiveProfiles("tx05")).
# Wlasna baza H2 w pamieci — lekcje nie dziela danych.
spring.datasource.url=jdbc:h2:mem:tx05
# Schemat tworzy Flyway (migracje lekcji), a Hibernate tylko SPRAWDZA, czy encje pasuja do tabel (validate).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/tx05
spring.jpa.hibernate.ddl-auto=validate
# DEBUG menedzera transakcji: widac transakcje z TransactionTemplate ("Creating new transaction with name [null]")
# i z PlatformTransactionManager.
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
