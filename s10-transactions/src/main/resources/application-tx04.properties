# Ustawienia lekcji Tx04ReadOnlyIsolation (profil "tx04"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:tx04
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/tx04
# Schemat tworzy Flyway; Hibernate tylko go sprawdza (s08_data_jpa/Jpa06FlywayWithJpa).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Podgląd: SQL wysyłany przez Hibernate (np. "for update" przy blokadzie pesymistycznej) i decyzje menedżera
# transakcji (izolacja, read-only, dołączanie) — odkomentuj:
#logging.level.org.hibernate.SQL=debug
#logging.level.org.springframework.orm.jpa.JpaTransactionManager=debug
