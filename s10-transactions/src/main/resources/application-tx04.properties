# Profil lekcji Tx04ReadOnlyIsolation (wlaczany w Tx04Application i w testach przez @ActiveProfiles("tx04")).
# Wlasna baza H2 w pamieci — lekcje nie dziela danych.
spring.datasource.url=jdbc:h2:mem:tx04
# Schemat tworzy Flyway (migracje lekcji), a Hibernate tylko SPRAWDZA, czy encje pasuja do tabel (validate).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/tx04
spring.jpa.hibernate.ddl-auto=validate
# DEBUG menedzera transakcji: w logu widac "Creating new transaction ... ISOLATION_REPEATABLE_READ,readOnly,timeout_5".
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
