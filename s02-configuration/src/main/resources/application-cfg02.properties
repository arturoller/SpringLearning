# Ustawienia lekcji Cfg02ConfigurationProperties (profil cfg02) — wiążą się z rekordem DeliveryProperties.
cfg02.shop.delivery.carrier=KurierExpress
cfg02.shop.delivery.timeout=45s
# Celowo BRAK max-parcels i max-label-size — rekord ma dla nich @DefaultValue.

# UWAGA: pliki .properties Boot czyta jako ISO-8859-1, więc polskie litery zapisujemy jako \uXXXX
# (Ł=\u0141 ó=\u00f3 ź=\u017a ń=\u0144). Szczegóły: lekcja Cfg01Properties, sekcja 1.

# Obiekt zagnieżdżony: kropka po nazwie pola rekordu.
cfg02.shop.delivery.warehouse.city=\u0141\u00f3d\u017a
cfg02.shop.delivery.warehouse.street=Magazynowa 5

# Lista: wartości po przecinku ...
cfg02.shop.delivery.cities=Warszawa,Krak\u00f3w,Gda\u0144sk
# ... albo z indeksami (to samo): cfg02.shop.delivery.cities[0]=Warszawa  cfg02.shop.delivery.cities[1]=Krak\u00f3w

# Mapa: klucz mapy to ostatni człon nazwy (tu: warszawa, krakow). Klucze pisz małymi literami, bez polskich znaków.
cfg02.shop.delivery.prices.warszawa=12.50
cfg02.shop.delivery.prices.krakow=15.00
