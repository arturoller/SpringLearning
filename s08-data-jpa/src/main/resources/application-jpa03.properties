# Ustawienia lekcji Jpa03QueryMethods (profil "jpa03"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:jpa03
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/jpa03
# Schemat tworzy Flyway; Hibernate tylko go sprawdza (s08_data_jpa/Jpa06FlywayWithJpa).
spring.jpa.hibernate.ddl-auto=validate
# Statystyki Hibernate — testy liczą nimi wysłane polecenia SQL.
spring.jpa.properties.hibernate.generate_statistics=true
# Podgląd SQL wygenerowanego z nazw metod — warto czytać go przy każdej nowej metodzie.
logging.level.org.hibernate.SQL=debug
