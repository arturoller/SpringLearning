# Ustawienia lekcji Jpa02Repositories (profil "jpa02"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:jpa02
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/jpa02
# Schemat tworzy Flyway; Hibernate przy starcie tylko SPRAWDZA, czy encje pasują do tabel (s08_data_jpa/Jpa06FlywayWithJpa).
spring.jpa.hibernate.ddl-auto=validate
# Statystyki Hibernate — testy liczą nimi wysłane polecenia SQL.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.SQL=debug
