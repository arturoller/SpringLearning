# Profil lekcji Jpa01Entities (wlaczany w Jpa01Application i w testach przez @ActiveProfiles("jpa01")).
# Wlasna baza H2 w pamieci — lekcje nie dziela danych.
spring.datasource.url=jdbc:h2:mem:jpa01
# show-sql = wypisuj SQL wysylany przez Hibernate (tylko do nauki; w produkcji uzyj logowania org.hibernate.SQL).
spring.jpa.show-sql=true
# format_sql = ladnie formatuj wypisany SQL (wlasciwosc samego Hibernate, przekazywana przez spring.jpa.properties.*).
spring.jpa.properties.hibernate.format_sql=true
