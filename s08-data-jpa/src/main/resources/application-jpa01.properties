# Ustawienia lekcji Jpa01Entities (profil "jpa01"): własna baza w pamięci, Flyway WYŁĄCZONY (jak we wspólnym pliku).
spring.datasource.url=jdbc:h2:mem:jpa01
# Hibernate sam tworzy tabele z encji przy starcie i usuwa je przy zamknięciu. Tylko do nauki i prototypów!
# Od Jpa02 schemat tworzy Flyway, a Hibernate go tylko sprawdza (validate) — s08_data_jpa/Jpa06FlywayWithJpa.
spring.jpa.hibernate.ddl-auto=create-drop
# Statystyki Hibernate (liczba zapytań, wstawień, aktualizacji) — testy liczą nimi wysłane polecenia SQL.
spring.jpa.properties.hibernate.generate_statistics=true
# Podgląd SQL przez logger (DOBRA PRAKTYKA) zamiast spring.jpa.show-sql=true (zwykłe System.out).
logging.level.org.hibernate.SQL=debug
