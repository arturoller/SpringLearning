# Ustawienia lekcji Jpa06FlywayWithJpa (profil "jpa06"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:jpa06
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/jpa06
# Podział ról (sekcja 1): schemat TWORZY Flyway (V1, V2, V3…), Hibernate przy starcie tylko go SPRAWDZA.
spring.jpa.hibernate.ddl-auto=validate
logging.level.org.hibernate.SQL=debug
