# Profil lekcji Jpa06FlywayWithJpa (włącza go Jpa06Application i testy przez @ActiveProfiles("jpa06")).
# Własna baza H2 w pamięci. W testach @DataJpaTest podmienia ją na bazę o losowej nazwie — Flyway i tak działa.
spring.datasource.url=jdbc:h2:mem:jpa06
# Ta lekcja UCZY Flyway: schemat i dane tworzą migracje z WŁASNEGO katalogu lekcji (nie z całego db/migration).
spring.flyway.locations=classpath:db/migration/jpa06
# Hibernate niczego nie tworzy — tylko SPRAWDZA przy starcie, czy tabele z migracji pasują do encji.
spring.jpa.hibernate.ddl-auto=validate
# Podgląd SQL przez logger (zalecany sposób): każde polecenie SQL trafia do logu z poziomem DEBUG.
logging.level.org.hibernate.SQL=debug
