# Wspolne ustawienia modulu s08-data-jpa — celowo MINIMALNE i BEZPIECZNE.
# Kazda lekcja ma wlasny plik application-<lekcja>.properties (profil), np. application-jpa01.properties,
# wlaczany przez klase startowa lekcji (setAdditionalProfiles) i w testach przez @ActiveProfiles.
#
# Flyway (migracje bazy) jest w module dla lekcji Jpa06. Domyslnie go WYLACZAMY, bo inaczej startowalby w KAZDEJ
# lekcji i szukal migracji w classpath:db/migration. Lekcja Jpa06 wlacza go w swoim profilu.
spring.flyway.enabled=false
