# Wspólny plik modułu s08-data-jpa jest celowo prawie pusty: ustawienia każdej lekcji leżą w pliku
# application-jpaNN.properties (profil lekcji, włączany w jej klasie startowej i w testach przez @ActiveProfiles),
# a baza H2 każdej lekcji ma własną nazwę (jdbc:h2:mem:jpaNN) — lekcje nie wchodzą sobie w drogę.
# Starter Flyway jest na ścieżce klas (classpath) całego modułu, dlatego KAŻDY profil lekcji mówi wprost:
# albo spring.flyway.enabled=false, albo spring.flyway.locations=classpath:db/migration/jpaNN (własny katalog migracji).
spring.main.banner-mode=off
