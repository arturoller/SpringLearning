# Profil lekcji Jpa04CustomQueries (włącza go Jpa04Application i testy przez @ActiveProfiles("jpa04")).
# Własna baza H2 w pamięci. W testach @DataJpaTest i tak podmienia ją na bazę o losowej, unikalnej nazwie.
spring.datasource.url=jdbc:h2:mem:jpa04
# Ta lekcja NIE uczy Flyway: schemat tworzy Hibernate z encji (ddl-auto), a dane sklepu wstawiają testy.
# Bez tej linii Flyway szukałby migracji w domyślnym classpath:db/migration — razem z podkatalogami,
# czyli migracjami WSZYSTKICH lekcji naraz.
spring.flyway.enabled=false
# Podgląd SQL przez logger (zalecany sposób): każde polecenie SQL trafia do logu z poziomem DEBUG.
logging.level.org.hibernate.SQL=debug
