# Ustawienia lekcji Jpa04CustomQueries (profil "jpa04"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:jpa04
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/jpa04
# Schemat tworzy Flyway; Hibernate tylko go sprawdza (s08_data_jpa/Jpa06FlywayWithJpa).
spring.jpa.hibernate.ddl-auto=validate
# Statystyki Hibernate — testy liczą nimi wczytane encje i wysłane polecenia SQL.
spring.jpa.properties.hibernate.generate_statistics=true
# Podgląd SQL — przy każdym @Query sprawdź, co naprawdę poszło do bazy.
logging.level.org.hibernate.SQL=debug
