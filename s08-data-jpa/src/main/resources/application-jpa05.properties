# Ustawienia lekcji Jpa05PagingSorting (profil "jpa05"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:jpa05
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/jpa05
# Schemat tworzy Flyway; Hibernate tylko go sprawdza (s08_data_jpa/Jpa06FlywayWithJpa).
spring.jpa.hibernate.ddl-auto=validate
# Statystyki Hibernate — testy liczą nimi wczytane encje i wysłane polecenia SQL.
spring.jpa.properties.hibernate.generate_statistics=true
# Podgląd SQL — LIMIT, OFFSET i dodatkowe zapytanie count widać w logu.
logging.level.org.hibernate.SQL=debug
