# Ustawienia lekcji Sec03UsersPasswords (profil "sec03"): własna baza w pamięci i Flyway z migracjami tej lekcji.
spring.datasource.url=jdbc:h2:mem:sec03
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sec03
# Schemat tworzy Flyway; Hibernate przy starcie tylko SPRAWDZA, czy encje pasują do tabel.
spring.jpa.hibernate.ddl-auto=validate
