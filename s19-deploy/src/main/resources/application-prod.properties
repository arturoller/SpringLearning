# Profil „prod” (produkcja) — wartości BEZPIECZNE do trzymania w repozytorium: adresy i limity, nigdy hasła ani klucze.
# Klucz API (shop.payment.api-key) przychodzi z zewnątrz: zmienna SHOP_PAYMENT_APIKEY, plik spoza JAR-a albo katalog sekretów.
shop.payment.url=https://platnosci.example.com/api
shop.payment.timeout=3s

# Mniej gadatliwe logi: na produkcji ostrzeżenia i błędy, a własne klasy na poziomie INFO.
logging.level.root=WARN
logging.level.s19_deploy=INFO

# Zdrowie aplikacji bez szczegółów (nie ujawniamy, jakich baz i usług używa). Wystawiamy tylko /actuator/health.
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health
